[package]
name = "cmdb-service"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "derive", "uuid", "chrono", "ipnetwork", "mac_address"] }
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
ipnetwork = { version = "0.20", features = ["serde"] }
mac_address = { version = "1.1", features = ["serde"] }

[dev-dependencies]
serde_json = "1"
