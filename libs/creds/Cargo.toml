[package]
name = "creds"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
moka = { version = "0.12.16", features = ["future"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["sync", "time", "rt"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "io-util"] }
wiremock = "0.6.5"
