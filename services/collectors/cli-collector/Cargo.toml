[package]
name = "cli-collector"
version = "0.1.0"
edition.workspace = true
license.workspace = true
# russh 0.64.1 includes current security fixes and requires Rust 1.89.
rust-version = "1.89"

[lints]
workspace = true

[dependencies]
async-nats = "0.46.0"
bus = { path = "../../../libs/bus" }
contracts = { path = "../../../libs/contracts" }
creds = { path = "../../../libs/creds" }
encoding_rs = "0.8.35"
futures = "0.3.34"
prost = "0.14.4"
prost-types = "0.14.4"
regex = "1.13.1"
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa"] }
secrecy = "0.10.3"
ssh-key = "=0.7.0-rc.11"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
# Fixed OSC buffer, including for malicious unterminated escape sequences.
vte = { version = "0.15.0", default-features = false }

[dev-dependencies]
async-trait = "0.1.92"
rand = "0.10"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["process", "io-util"] }
