[package]
name = "trap-receiver"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-nats = "0.46.0"
async-trait = "0.1.92"
bus = { version = "0.1.0", path = "../../../libs/bus" }
contracts = { version = "0.1.0", path = "../../../libs/contracts" }
creds = { version = "0.1.0", path = "../../../libs/creds" }
futures = "0.3.34"
ipnet = "2.12.2"
prost = "0.14.4"
prost-types = "0.14.4"
secrecy = "0.10.3"
snmp-types = { version = "0.1.0", path = "../../../libs/snmp-types" }
socket2 = "0.6.5"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
bus = { path = "../../../libs/bus" }
tokio = { version = "1.53.2", features = ["process", "rt-multi-thread", "macros", "time", "net"] }
