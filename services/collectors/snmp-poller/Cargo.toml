[package]
name = "snmp-poller"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-nats = "0.46.0"
async-trait = "0.1.92"
bus = { version = "0.1.0", path = "../../../libs/bus" }
contracts = { version = "0.1.0", path = "../../../libs/contracts" }
creds = { version = "0.1.0", path = "../../../libs/creds" }
futures = "0.3.34"
ipnet = "2.12.2"
prost = "0.14.4"
prost-types = "0.14.4"
secrecy = "0.10.3"
snmp-types = { version = "0.1.0", path = "../../../libs/snmp-types" }
# heap_buffers: без неё AsyncSession держит буфер 64 КБ на стеке и async-задачи tokio
# падают с stack overflow (проверено сквозным тестом)
snmp2 = { version = "0.5.2", features = ["heap_buffers"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

[dev-dependencies]
# process нужен только сквозному тесту, который запускает бинарник poller
tokio = { version = "1.53.2", features = ["process", "rt-multi-thread", "macros", "time"] }
prost-types = "0.14.4"
