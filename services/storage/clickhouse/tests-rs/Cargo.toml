[package]
name = "cronet-clickhouse-schema-tests"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

# Deliberately outside the runtime workspace: only a real-server test executable.
[workspace]
resolver = "3"

[dev-dependencies]
clickhouse = { version = "=0.13.3", features = ["uuid"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = "1"
