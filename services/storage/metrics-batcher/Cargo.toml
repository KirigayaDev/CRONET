[package]
name = "metrics-batcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-nats = "0.46.0"
bus = { path = "../../../libs/bus" }
contracts = { path = "../../../libs/contracts" }
clickhouse = { version = "=0.13.3", features = ["uuid", "rustls-tls"] }
futures = "0.3.34"
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
url = "2.5.8"
uuid = "1.28.0"

[dev-dependencies]
prost-types = "0.14.4"
tokio = { version = "1.53.2", features = ["process", "net", "io-util", "test-util"] }
