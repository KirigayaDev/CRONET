[package]
name = "discovery-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.89"
publish = false

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
clap = { version = "4", features = ["derive"] }
contracts = { path = "../../../../libs/contracts" }
creds = { path = "../../../../libs/creds" }
snmp-types = { path = "../../../../libs/snmp-types" }
futures = "0.3.34"
ipnet = "2.12.2"
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snmp2 = { version = "0.5.2", features = ["heap_buffers"] }
surge-ping = "0.9.1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tonic = { version = "0.14", features = ["tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid"] }
tempfile = "3"
