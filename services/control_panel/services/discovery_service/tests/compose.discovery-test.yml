# Disposable D3 project. No production .env, published ports, host keys or DB mounts.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: cmdb_test
      POSTGRES_DB: cronet_cmdb_test_schema
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "cmdb_test", "-d", "cronet_cmdb_test_schema"]
      interval: 1s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8.2.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
  database_migrations:
    build:
      context: ../../database_migrations
    environment:
      POSTGRES_USER: cmdb_test
      POSTGRES_PASSWORD: ""
      POSTGRES_DB: cronet_cmdb_test_schema
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      postgres:
        condition: service_healthy
  rust:
    build:
      context: ../../cmdb_service/tests
      dockerfile: Dockerfile.rust
    command: ["sleep", "infinity"]
    environment:
      CARGO_TARGET_DIR: /build
      CMDB_TEST_DATABASE_URL: postgresql://cmdb_test@postgres/cronet_cmdb_test_schema?sslmode=disable
      CMDB_TEST_REDIS_URL: redis://redis:6379
      CMDB_TEST_BINARY: /build/debug/cmdb-service
      DISCOVERY_E2E: "1"
    volumes:
      - ../../../../..:/workspace:ro
      - cargo_registry:/usr/local/cargo/registry
      - cargo_target:/build
    depends_on:
      database_migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  snmpsim:
    image: python:3.12-slim
    # Loopback targets exercise literal IPs without published ports or DNS targets.
    network_mode: service:rust
    command:
      - /bin/sh
      - -ec
      - >-
        pip install --no-cache-dir snmpsim-lextudio==1.1.1 &&
        exec snmpsim-command-responder
        --process-user=nobody --process-group=nogroup --data-dir=/data
        --agent-udpv4-endpoint=0.0.0.0:1161 --agent-udpv6-endpoint=[::1]:1161
        --v3-user=mon --v3-auth-key=authpass123 --v3-auth-proto=SHA256
        --v3-priv-key=privpass123 --v3-priv-proto=AES128
    volumes:
      - ./snmp:/data:ro
    depends_on:
      rust:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys; sys.exit(0 if any(line.split()[1].endswith(':0489') for line in open('/proc/net/udp').read().splitlines()[1:]) else 1)"
      interval: 1s
      timeout: 3s
      retries: 90
      start_period: 5s
volumes:
  cargo_registry:
  cargo_target:
