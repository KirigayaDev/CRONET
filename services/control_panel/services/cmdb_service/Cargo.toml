[package]
name = "cmdb-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.89"
publish = false

[lints]
workspace = true

[dependencies]
contracts = { path = "../../../../libs/contracts" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "signal", "sync"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "derive", "uuid", "chrono", "ipnetwork", "mac_address", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
ipnetwork = { version = "0.20", features = ["serde"] }
mac_address = { version = "1.1", features = ["serde"] }
axum = { version = "0.8", features = ["multipart"] }
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
rsa = "0.9"
redis = { version = "0.32", default-features = false, features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
csv = "1"
blake3 = "1"
similar = "2"
rust_xlsxwriter = { version = "0.99.1", default-features = false }

[dev-dependencies]
clickhouse = { version = "0.13.3", default-features = false }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile = "3"
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2"] }
