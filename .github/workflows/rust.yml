name: Rust CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --exclude cmdb-service

  supply-chain:
    name: cargo-audit, cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install tools
        run: cargo install cargo-audit cargo-deny --locked
      - name: cargo audit
        id: audit
        continue-on-error: true
        run: cargo audit
      - name: cargo deny
        id: deny
        continue-on-error: true
        run: cargo deny check
      - name: Warn if findings
        if: steps.audit.outcome == 'failure' || steps.deny.outcome == 'failure'
        run: echo "::warning title=Security::cargo audit/deny нашли замечания, смотрите лог"

  e2e:
    name: end-to-end (NATS + snmpsim)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start test environment
        run: docker compose -f testenv_snmp/docker-compose.yml up -d
      - name: Wait for snmpsim
        run: sleep 25
      - name: Run e2e
        run: NETMON_E2E=1 cargo test --workspace --exclude cmdb-service -- --test-threads=1

  cmdb-unit:
    name: CMDB static and unit (Rust 1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p cmdb-service --all-targets
      - run: cargo test --locked -p cmdb-service --lib

  cmdb-integration:
    name: CMDB PostgreSQL and Redis integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: cronet-cmdb-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: services/control_panel/services/cmdb_service/tests/compose.core-test.yml
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Start isolated CMDB environment
        run: docker compose up -d --build rust
      - name: Run all CMDB tests
        run: docker compose exec -T rust cargo test --locked -p cmdb-service
      - name: Cleanup isolated CMDB environment
        if: always()
        run: docker compose down --volumes

  cmdb-migrations:
    name: CMDB Alembic integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: cronet-cmdb-migrations-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: services/control_panel/services/database_migrations/tests/compose.cmdb-test.yml
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker compose build database_migrations
      - run: docker compose up -d --wait postgres
      - name: Run migration suite including downgrade and repeated upgrade
        run: docker compose run --rm --no-deps database_migrations python -B -m unittest discover -s tests -p test_cmdb_migration.py -v
      - name: Cleanup isolated migration environment
        if: always()
        run: docker compose down --volumes

  scheduler-e2e:
    name: Scheduler JetStream coordination and CMDB acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: cronet-scheduler-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: services/control_panel/services/scheduler_service/tests/compose.scheduler-test.yml
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Start isolated Scheduler environment
        run: docker compose up -d --build --wait snmpsim
      - name: Build existing CMDB and SNMP poller binaries
        run: docker compose exec -T rust cargo build --locked -p cmdb-service -p snmp-poller
      - name: Run real JetStream, failover and CMDB acceptance
        run: docker compose exec -T rust cargo test --locked -p scheduler-service --test integration --test acceptance -- --test-threads=1
      - name: Cleanup isolated Scheduler environment
        if: always()
        run: docker compose down --volumes
