name: ClickHouse schema integration

on:
  push:
    branches: ["main", "master", "develop", "feature/c1-clickhouse-ddl", "feature/c2-metrics-batcher"]
  pull_request:
    branches: ["main", "master", "develop"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: cronet-c1-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: services/storage/clickhouse/tests/compose.yml
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build test runner
        run: docker compose build integration
      - name: Start isolated ClickHouse 25.8
        run: docker compose up -d --wait clickhouse
      - name: Apply migrations and test schema, replay, batches, and queries
        run: docker compose run --rm integration
      - name: Diagnostics
        if: failure()
        run: docker compose logs --no-color clickhouse
      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
