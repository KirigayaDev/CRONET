name: Logs batcher integration
on:
  push:
    branches: ["main", "master", "develop", "feature/c3-logs-batcher"]
  pull_request:
    branches: ["main", "master", "develop"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  logs-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: cronet-c3-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: services/storage/logs-batcher/tests/compose.yml
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build test runner
        run: docker compose build integration
      - name: Start isolated NATS and ClickHouse
        run: docker compose up -d --wait nats clickhouse
      - name: Real logs pipeline, outages, rejection, replicas, and 10k sanity
        run: docker compose run --rm integration
      - name: Build non-root production image
        run: docker build -f services/storage/logs-batcher/Dockerfile -t cronet-logs-batcher .
      - name: Verify production user
        run: test "$(docker inspect --format '{{.Config.User}}' cronet-logs-batcher)" = '65532:65532'
      - name: Diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
